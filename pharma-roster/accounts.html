<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการบัญชี — pharma-roster</title><link rel="stylesheet" href="preferences.css?v=team1"></head><body><header class="staff-header"><a class="staff-brand" href="./admin.html?v=team1">▦ pharma-roster</a><a href="./admin.html?v=team1">กลับหน้าจัดตาราง</a></header><main class="staff-main"><h1>จัดการบัญชีผู้ใช้</h1><p>admin สร้างบัญชีให้เภสัชกร หรือเปลี่ยนรหัสผ่าน 6 ตัวได้</p><section class="access-box"><form id="account-form"><label>การทำรายการ<select id="account-mode"><option value="POST">สร้างบัญชีเภสัชกร</option><option value="PUT">เปลี่ยนรหัสผ่านบัญชีเดิม</option></select></label><label id="new-user-label">ชื่อผู้ใช้ใหม่<input id="new-username" minlength="3" maxlength="40" autocomplete="off" placeholder="เช่น staff01"></label><label id="existing-user-label" hidden>บัญชีที่ต้องการเปลี่ยนรหัส<select id="existing-username"></select></label><label id="person-label">เภสัชกร<select id="account-person" required></select></label><label>รหัสผ่านใหม่ 6 ตัว<input id="account-password" type="password" minlength="6" maxlength="6" autocomplete="new-password" required></label><label>ยืนยันรหัสผ่าน<input id="confirm-password" type="password" minlength="6" maxlength="6" autocomplete="new-password" required></label><button class="primary" id="account-save" type="submit">บันทึกบัญชี</button></form><p id="account-status" role="status"></p></section><section class="calendar-card" style="padding:24px"><h2>บัญชีในระบบ</h2><div id="account-list"></div><p>รหัสผ่านเก็บแบบแฮช ไม่สามารถเปิดดูรหัสเดิมได้ หากลืมให้ admin ตั้งรหัสใหม่</p></section></main><script src="./connection.js?v=team1"></script><script type="module" src="accounts.mjs?v=team1"></script></body></html>
